<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Metric Lab low-fidelity wireframe</title><desc id="desc">Metric definition, formula, data contract, validation result and association warning.</desc><rect width="1200" height="760" fill="#eeeeea"/><rect width="220" height="760" fill="#303936"/><text x="28" y="50" fill="#fff" font-family="sans-serif" font-weight="700">COMMUNITY INTELLIGENCE</text><g font-family="sans-serif" font-size="14" fill="#dfe4e1"><text x="30" y="124">Overview</text><text x="30" y="166">Campaigns</text><text x="30" y="208">Communities</text><text x="30" y="250">Behaviors</text><text x="30" y="292">Response Patterns</text><rect x="14" y="310" width="192" height="38" rx="6" fill="#59635f"/><text x="30" y="334">Metric Lab</text><text x="30" y="380">Evidence</text></g><line x1="220" y1="64" x2="1200" y2="64" stroke="#b8bdb9"/><text x="260" y="118" font-family="sans-serif" font-size="12">DISCOVER, THEN VALIDATE</text><text x="260" y="158" font-family="sans-serif" font-size="34" font-weight="700">Metric Lab</text><rect x="930" y="112" width="240" height="38" rx="6" fill="#fff" stroke="#777"/><text x="950" y="136" font-family="sans-serif" font-size="12">Metric: discussion share ▼</text>
  <rect x="260" y="194" width="445" height="440" rx="8" fill="#fafaf7" stroke="#9fa5a1"/><text x="282" y="228" font-family="sans-serif" font-size="16" font-weight="700">Candidate metric definition</text><g font-family="sans-serif" font-size="12"><text x="282" y="270" font-weight="700">Business meaning</text><text x="282" y="292">Share of real-user messages discussing campaign</text><text x="282" y="336" font-weight="700">Formula</text><rect x="282" y="352" width="400" height="54" rx="5" fill="#e5e7e4" stroke="#b0b5b1"/><text x="298" y="384">campaign-related / all real-user messages</text><text x="282" y="448" font-weight="700">Unit of analysis</text><text x="282" y="470">community-campaign window</text><text x="282" y="514" font-weight="700">Required fields</text><text x="282" y="536">message · timestamp · role · campaign · community</text><text x="282" y="580" font-weight="700">Biases and limitations</text><text x="282" y="602">Aliases may miss indirect references; volume can dominate</text></g>
  <rect x="725" y="194" width="445" height="440" rx="8" fill="#fafaf7" stroke="#9fa5a1"/><text x="747" y="228" font-family="sans-serif" font-size="16" font-weight="700">Observed validation</text><rect x="747" y="256" width="400" height="185" rx="6" fill="#e8e9e6" stroke="#acb2ae"/><line x1="785" y1="410" x2="1110" y2="410" stroke="#737c77"/><polyline points="790,390 860,360 930,375 1000,310 1070,330 1110,280" fill="none" stroke="#59635f" stroke-width="3"/><g font-family="sans-serif" font-size="12"><text x="747" y="482">Association estimate: 0.42</text><text x="747" y="516">Sample size: 12 community-campaign windows</text><text x="747" y="550">Method: bounded Spearman validation</text><text x="747" y="584">Multiple testing: adjusted / reported</text><text x="747" y="610" text-decoration="underline">Inspect observations and evidence</text></g>
  <rect x="260" y="662" width="910" height="62" rx="6" fill="#fff" stroke="#787f7b"/><text x="280" y="687" font-family="sans-serif" font-size="13" font-weight="700">Interpretation: association, not causation.</text><text x="280" y="709" font-family="sans-serif" font-size="12">Synthetic validation does not establish external validity.</text>
</svg>
