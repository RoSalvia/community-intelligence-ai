  <title id="title">Communities low-fidelity wireframe</title><desc id="desc">Community comparison without composite score, with separate activation and hygiene observations.</desc><rect width="1200" height="760" fill="#eeeeea"/><rect width="220" height="760" fill="#303936"/><text x="28" y="50" fill="#fff" font-family="sans-serif" font-weight="700">COMMUNITY INTELLIGENCE</text><g font-family="sans-serif" font-size="14" fill="#dfe4e1"><text x="30" y="124">Overview</text><text x="30" y="166">Campaigns</text><rect x="14" y="186" width="192" height="38" rx="6" fill="#59635f"/><text x="30" y="210">Communities</text><text x="30" y="254">Behaviors</text><text x="30" y="296">Response Patterns</text><text x="30" y="338">Metric Lab</text><text x="30" y="380">Evidence</text></g><line x1="220" y1="64" x2="1200" y2="64" stroke="#b8bdb9"/><text x="260" y="118" font-family="sans-serif" font-size="12">COMPARE, DO NOT SCORE</text><text x="260" y="158" font-family="sans-serif" font-size="34" font-weight="700">Communities</text><rect x="1000" y="112" width="170" height="38" rx="6" fill="#fff" stroke="#777"/><text x="1020" y="136" font-family="sans-serif" font-size="12">All campaigns ▼</text>
