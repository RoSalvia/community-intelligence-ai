[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "community-intelligence-ai"
version = "0.1.0"
description = "Offline synthetic-first multilingual community intelligence MVP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "fastapi>=0.116",
    "networkx>=3.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "uvicorn>=0.35",
]

[project.scripts]
community-intelligence = "community_intelligence.cli:main"

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.2"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "httpx2>=2.0",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"community_intelligence.web" = [
    "static/index.html",
    "static/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "semantic: requires a separately prefetched local sentence-transformer model",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
